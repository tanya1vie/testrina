name: Sync Instagram gallery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download recent Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_POST_LIMIT: 50
        run: node tools/sync-instagram.mjs
      - name: Commit updated gallery data
        run: |
          if git diff --quiet -- assets/data/instagram-posts.json; then
            echo "Instagram feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/instagram-posts.json
          git commit -m "Update Instagram gallery"
          git push
