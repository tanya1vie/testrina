<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatiana Estrina</title>

  <!-- Use relative paths so it works in any folder (incl. GitHub Pages project sites) -->
  <link rel="stylesheet" href="CSS Files/base.css" />
  <link rel="stylesheet" href="CSS Files/falling.css" />
  <link rel="stylesheet" href="CSS Files/cursor.css">
  <link rel="stylesheet" href="CSS Files/flipWord.css">

  <!-- ✅ NEW: puzzle styles -->
  <link rel="stylesheet" href="CSS Files/puzzle.css">

  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .grid-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 230 / 290; /* keeps 230x290 box */
      cursor: pointer;
      transition: transform .3s ease;
      text-decoration: none;
      display: block;
      border-radius: 8px;
    }
    .grid-item:hover { transform: scale(1.02); }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 20px; color: #fff;
      background: linear-gradient(transparent, rgba(0,0,0,.5));
    }
    .titleSection{ text-align: left; padding: 2rem 1rem; }
    .titleSection h1{ margin: 0; font-size: 2rem; }
    .titleSection .subtitle{ opacity: .8; }
    header .breadcrumb img { display: block; }
    .amazon-link{
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .amazon-link:hover{ opacity: 0.7; }

    @media (max-width: 820px) { .grid-container { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 520px) { .grid-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="header"></div>

<script>
  fetch("header.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;

      // ✅ IMPORTANT: load header JS AFTER header exists
      const s = document.createElement("script");
      s.src = "JavaScript Files/headerBubbles.js";
      document.body.appendChild(s);
    });
</script>


  <div class="titleSection">
    <div class="subtitle"> Hey! </div>
    <h1>I'm Tanya.</h1>

    <div class="subtitle">
      I'm a
      <span class="flip-container">
        <span class="flip-word active">designer</span>
        <span class="flip-word">creative coder</span>
        <span class="flip-word">ballroom dancer</span>
        <span class="flip-word">ceramicist</span>
        <span class="flip-word">writer</span>
        <span class="flip-word">problem solver</span>
        <span class="flip-word">urban sketcher</span>
        <span class="flip-word">cat mom</span>
      </span>
      and am currently an Industrial Designer at
      <a
        href="https://www.aboutamazon.com/news/tag/robotics"
        target="_blank"
        rel="noopener noreferrer"
        class="amazon-link"
      >
        Amazon Robotics
      </a>.
    </div>
    <br><br>

    <!-- ✅ CIRCLES HERE -->
    <div id="puzzleHero" class="puzzle-hero" aria-label="Interactive triangle puzzle"></div>
  </div>


  <div class="custom-cursor" id="customCursor"></div>
  
  <script src="JavaScript Files/cursor.js"></script>

  <script src="JavaScript Files/popUp.js"></script>
  <script src="JavaScript Files/flipWord.js"></script>

  <!-- ✅ NEW: puzzle behavior -->
  <script src="JavaScript Files/puzzle.js"></script>
</body>
</html>
