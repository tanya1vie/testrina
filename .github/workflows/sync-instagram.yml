name: Sync Instagram gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: Check Instagram connection
        id: connection
        shell: bash
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Instagram sync skipped because INSTAGRAM_ACCESS_TOKEN is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.connection.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.connection.outputs.configured == 'true'
        with:
          node-version: 20

      - name: Download recent Instagram posts
        if: steps.connection.outputs.configured == 'true'
        env:
          INSTAGRAM_USERNAME: mani__festations
          INSTAGRAM_POST_LIMIT: 50
        run: node tools/sync-instagram.mjs

      - name: Commit updated gallery data
        if: steps.connection.outputs.configured == 'true'
        run: |
          if git diff --quiet -- assets/data/instagram-posts.json; then
            echo "Instagram feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/instagram-posts.json
          git commit -m "Update Instagram gallery"
          git push
