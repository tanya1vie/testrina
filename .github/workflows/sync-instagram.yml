name: Scrape Instagram gallery

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - instagram-no-auth-scraper
    paths-ignore:
      - assets/data/instagram-posts.json
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            assets/data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download public Instagram posts
        env:
          INSTAGRAM_USERNAME: mani__festations
          INSTAGRAM_POST_LIMIT: 12
        run: node tools/scrape-instagram.mjs
      - name: Commit updated gallery data
        run: |
          if git diff --quiet -- assets/data/instagram-posts.json; then
            echo "Instagram feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/instagram-posts.json
          git commit -m "Update Instagram gallery"
          git push
