<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Art Gallery</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/cursor.css">
  <link rel="stylesheet" href="assets/css/nailGallery.css">
</head>
<body>
  <div id="header"></div>
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
        const script = document.createElement("script");
        script.src = "assets/js/headerBubbles.js";
        document.body.appendChild(script);
      });
  </script>

  <br><br><br><br>

  <section class="nail-intro" aria-labelledby="nailGalleryTitle">
    <h1 id="nailGalleryTitle">Nail Gallery</h1>
    <p>Explore my custom press-on nail designs, from art-inspired sets to one-of-a-kind commissions. See more of my work on <a href="https://www.instagram.com/mani__festations/" target="_blank" rel="noopener noreferrer"><strong>Instagram</strong></a>.</p>
  </section>

  <main class="nail-gallery" id="nailGallery" aria-live="polite">
    <p class="gallery-status">Loading nail gallery…</p>
  </main>

  <div class="nail-modal" id="nailModal" role="dialog" aria-modal="true" aria-labelledby="nailTitle" hidden>
    <div class="nail-modal-panel">
      <button class="nail-close" id="nailClose" type="button" aria-label="Close">&times;</button>
      <section class="nail-media-stage" id="nailMediaStage" aria-label="Nail set media">
        <button class="nail-nav nail-prev" id="nailPrevious" type="button" aria-label="Previous media">&#8249;</button>
        <button class="nail-nav nail-next" id="nailNext" type="button" aria-label="Next media">&#8250;</button>
        <div class="nail-dots" id="nailDots"></div>
      </section>
      <section class="nail-modal-info">
        <h1 id="nailTitle"></h1>
        <p class="nail-meta" id="nailMeta"></p>
        <p class="nail-caption" id="nailCaption"></p>
        <p><a class="nail-instagram-link" id="nailInstagram" target="_blank" rel="noopener noreferrer">View the Instagram post</a></p>
      </section>
    </div>
  </div>

  <div id="footer"></div>
  <div class="custom-cursor" id="customCursor"></div>

  <script src="assets/js/nailGallery.js" defer></script>
  <script>
    fetch("footer.html")
      .then(response => response.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>
  <script src="assets/js/fadeIn.js" defer></script>
  <script src="assets/js/cursor.js"></script>
</body>
</html>
