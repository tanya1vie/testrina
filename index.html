<!DOCTYPE html> 
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatiana Estrina</title>

  <!-- Use relative paths so it works in any folder (incl. GitHub Pages project sites) -->
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/falling.css" />
  <link rel="stylesheet" href="assets/css/cursor.css">
  <link rel="stylesheet" href="assets/css/flipWord.css">

  <!-- ✅ NEW: puzzle styles -->
  <link rel="stylesheet" href="assets/css/puzzle.css">

  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .grid-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 230 / 290; /* keeps 230x290 box */
      cursor: pointer;
      transition: transform .3s ease;
      text-decoration: none;
      display: block;
      border-radius: 8px;
    }
    .grid-item:hover { transform: scale(1.02); }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 20px; color: #fff;
      background: linear-gradient(transparent, rgba(0,0,0,.5));
    }
    .titleSection{ text-align: left; padding: 2rem 1rem; }
    .titleSection h1{
      margin: .5rem 0;
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      line-height: 1.05;
    }
    .titleSection .subtitle{
      color: #1f1f1f;
      font-size: clamp(1.125rem, 1.75vw, 1.25rem);
      line-height: 1.5;
      opacity: 1;
    }
    .titleSection .home-kicker{
      font-size: clamp(1.125rem, 1.75vw, 1.25rem);
      font-weight: 600;
    }
    header .breadcrumb img { display: block; }
    .amazon-link{
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }


    @media (max-width: 820px) { .grid-container { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 520px) { .grid-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="header"></div>

<script>
  fetch("header.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("header").innerHTML = html;

      // ✅ IMPORTANT: load header JS AFTER header exists
      const s = document.createElement("script");
      s.src = "assets/js/headerBubbles.js";
      document.body.appendChild(s);
    });
</script>

  <main id="main-content">
  <div class="titleSection">
    <div class="subtitle home-kicker">Hey!</div>
    <h1 class="name">I'm Tanya.</h1>
    <div class="subtitle">
      I'm a
      <span class="sr-only">multidisciplinary designer</span>
      <span class="flip-container" aria-hidden="true">
        <span class="flip-word active">designer</span>
        <span class="flip-word">creative coder</span>
        <span class="flip-word">ballroom dancer</span>
        <span class="flip-word">ceramicist</span>
        <span class="flip-word">writer</span>
        <span class="flip-word">problem solver</span>
        <span class="flip-word">urban sketcher</span>
        <span class="flip-word">cat mom</span>
      </span>
      and am currently an Industrial Designer at
      <a class="text-link"
        href="https://www.aboutamazon.com/news/tag/robotics"
        target="_blank"
        rel="noopener noreferrer"
      >
        Amazon Robotics
      </a>.
    </div>
    <br><br>

    <div
      id="puzzleHero"
      class="puzzle-hero"
      role="navigation"
      aria-label="Explore work by discipline"
    ></div>
  </div>
  </main>


  <div class="custom-cursor" id="customCursor"></div>
  
  <script src="assets/js/cursor.js"></script>

  <script src="assets/js/popUp.js"></script>
  <script src="assets/js/flipWord.js"></script>

  <!-- ✅ NEW: puzzle behavior -->
  <script src="assets/js/puzzle.js"></script>
</body>
</html>
