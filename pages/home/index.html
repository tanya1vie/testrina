<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tatiana Estrina</title>

    <!-- Use relative paths so it works in any folder (incl. GitHub Pages project sites) -->
    <link rel="stylesheet" href="shared/styles/base.css" />
    <link rel="stylesheet" href="pages/home/falling.css" />
    <link rel="stylesheet" href="shared/styles/cursor.css" />
    <link rel="stylesheet" href="shared/styles/flipWord.css" />

    <!-- ✅ NEW: puzzle styles -->
    <link rel="stylesheet" href="pages/home/puzzle.css" />
    <link rel="stylesheet" href="pages/home/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="header"></div>

    <script>
      fetch("shared/components/header.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;

          // ✅ IMPORTANT: load header JS AFTER header exists
          const s = document.createElement("script");
          s.src = "shared/scripts/headerBubbles.js";
          document.body.appendChild(s);
        });
    </script>

    <main id="main-content">
      <div class="titleSection">
        <div class="subtitle home-kicker">Hey!</div>
        <h1 class="name">I'm Tanya.</h1>
        <div class="subtitle">
          I'm a
          <span class="sr-only">multidisciplinary designer</span>
          <span class="flip-container" aria-hidden="true">
            <span class="flip-word active">designer</span>
            <span class="flip-word">creative coder</span>
            <span class="flip-word">ballroom dancer</span>
            <span class="flip-word">ceramicist</span>
            <span class="flip-word">writer</span>
            <span class="flip-word">problem solver</span>
            <span class="flip-word">urban sketcher</span>
            <span class="flip-word">cat mom</span>
          </span>
          and am currently an Industrial Designer at
          <a
            class="text-link"
            href="https://www.aboutamazon.com/news/tag/robotics"
            target="_blank"
            rel="noopener noreferrer"
          >
            Amazon Robotics </a
          >.
        </div>
        <br /><br />

        <div
          id="puzzleHero"
          class="puzzle-hero"
          role="navigation"
          aria-label="Explore work by discipline"
        ></div>
      </div>
    </main>

    <div class="custom-cursor" id="customCursor"></div>

    <script src="shared/scripts/cursor.js"></script>

    <script src="pages/home/popUp.js"></script>
    <script src="shared/scripts/flipWord.js"></script>

    <!-- ✅ NEW: puzzle behavior -->
    <script src="pages/home/puzzle.js"></script>
  </body>
</html>
