name: Build nail gallery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-nail-gallery.yml"\n      - "Images/Nails/**"
      - "assets/data/nails.csv"
      - "tools/build-nail-gallery.mjs"

permissions:
  contents: write

concurrency:
  group: nail-gallery-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build gallery data
        run: node tools/build-nail-gallery.mjs
      - name: Commit generated gallery
        run: |
          if git diff --quiet -- assets/data/nails-gallery.json; then
            echo "Gallery is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/nails-gallery.json
          git commit -m "Update nail gallery"
          git push
