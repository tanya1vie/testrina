<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Art Gallery</title>
  <link rel="stylesheet" href="CSS Files/base.css">
  <link rel="stylesheet" href="CSS Files/cursor.css">
  <link rel="stylesheet" href="CSS Files/imageGallery.css">
  <style>
    .gallery-status { grid-column: 1 / -1; padding: 2rem; text-align: center; }
    .project-link { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; width: 100%; }
    .project-link img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .instagram-caption { white-space: pre-wrap; }
    .instagram-post-link { color: inherit; text-decoration: underline; }
    .popup-gallery video { display: none; max-width: 100%; max-height: 100%; }
    .popup-gallery video.active { display: block; }
  </style>
</head>
<body>
  <div id="header"></div>
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
        const script = document.createElement("script");
        script.src = "JavaScript Files/headerBubbles.js";
        document.body.appendChild(script);
      });
  </script>

  <br><br><br><br>

  <main class="gallery-grid" id="instagramGallery" aria-live="polite">
    <p class="gallery-status">Loading recent nail art…</p>
  </main>

  <div class="popup-overlay" id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle" hidden style="display: none;">
    <div class="popup-content">
      <button class="close-popup" id="closePopup" aria-label="Close">&times;</button>
      <div class="popup-gallery" id="popupGallery"></div>
      <div class="popup-info" id="popupInfo">
        <p id="popupYear"></p>
        <h1 id="popupTitle">Instagram post</h1>
        <p class="instagram-caption" id="popupDescription"></p>
        <p><a class="instagram-post-link" id="popupPostLink" target="_blank" rel="noopener noreferrer">View original post on Instagram</a></p>
      </div>
      <div class="carousel-dots" id="carouselDots"></div>
      <br><br>
    </div>
  </div>

  <div id="footer"></div>
  <div class="custom-cursor" id="customCursor"></div>

  <script src="JavaScript Files/instagramGallery.js" defer></script>
  <script>
    fetch("footer.html")
      .then(response => response.text())
      .then(html => { document.getElementById("footer").innerHTML = html; });
  </script>
  <script src="JavaScript Files/fadeIn.js" defer></script>
  <script src="JavaScript Files/cursor.js"></script>
</body>
</html>
